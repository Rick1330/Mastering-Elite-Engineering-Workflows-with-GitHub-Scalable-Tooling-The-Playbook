name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use semantic-version form, such as v1.2.3" >&2
            exit 1
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy selected artifact
        env:
          VERSION: ${{ inputs.version }}
          ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
          PRODUCTION_BUCKET: ${{ vars.AWS_PRODUCTION_BUCKET }}
        run: aws s3 sync "s3://${ARTIFACT_BUCKET}/${VERSION}/" "s3://${PRODUCTION_BUCKET}/"
